name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/check.js
        env:
          # Project site lives at https://<owner>.github.io/<repo>/.
          # After attaching a custom domain (e.g. alimatgroup.com), delete these two lines.
          SITE_BASE: /${{ github.event.repository.name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io
          # Test copy on github.io must not be indexed (avoids duplicate content after moving to alimatgroup.com).
          SITE_NOINDEX: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
