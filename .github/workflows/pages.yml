name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Production switch: set the repository variable CUSTOM_DOMAIN (e.g. alimatgroup.com)
      # in Settings → Secrets and variables → Actions → Variables. Without it the site
      # builds as a noindex test copy at https://<owner>.github.io/<repo>/.
      - name: Build target
        env:
          DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          if [ -n "$DOMAIN" ]; then
            echo "SITE_URL=https://$DOMAIN" >> "$GITHUB_ENV"
          else
            echo "SITE_BASE=/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
            echo "SITE_URL=https://${{ github.repository_owner }}.github.io" >> "$GITHUB_ENV"
            echo "SITE_NOINDEX=1" >> "$GITHUB_ENV"
          fi
      - run: node tools/check.js
      - name: CNAME
        if: ${{ vars.CUSTOM_DOMAIN != '' }}
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
